name: Release Build and Publish

on:
  push:
    tags:
      - 'v*.*.*'
      - 'V*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend-qwik/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend-qwik
      run: npm ci

    - name: Build frontend
      working-directory: frontend-qwik
      run: npm run build

    - name: Build Go server
      run: go build -o release/stora-server ./cmd/server

    - name: Build Go CLI
      run: go build -o release/stora-cli ./cmd/cli

    - name: Determine release version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.release_version }}"
        else
          REF_NAME="${{ github.ref }}"
          VERSION=${REF_NAME#refs/tags/}
          VERSION=${VERSION#[vV]}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION"

    - name: Create release archive
      run: |
        mkdir -p release/stora-${{ steps.version.outputs.version }}
        cp release/stora-server release/stora-${{ steps.version.outputs.version }}/
        cp release/stora-cli release/stora-${{ steps.version.outputs.version }}/
        cp -r migrations release/stora-${{ steps.version.outputs.version }}/
        cd release
        zip -r stora-v${{ steps.version.outputs.version }}.zip stora-${{ steps.version.outputs.version }}/
        cd ..
        sha256sum release/stora-v${{ steps.version.outputs.version }}.zip > release/stora-v${{ steps.version.outputs.version }}-checksums.txt

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: stora-release-${{ steps.version.outputs.version }}
        path: |
          release/stora-v${{ steps.version.outputs.version }}.zip
          release/stora-v${{ steps.version.outputs.version }}-checksums.txt
        retention-days: 30

    - name: Create GitHub Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/stora-v${{ steps.version.outputs.version }}.zip
          release/stora-v${{ steps.version.outputs.version }}-checksums.txt
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify on success
      if: success()
      run: |
        echo "✅ Release build completed successfully!"
        echo "Version: ${{ steps.version.outputs.version }}"
